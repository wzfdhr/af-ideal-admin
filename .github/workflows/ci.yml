name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - framework
      - main
      - master
  pull_request:
    branches:
      - framework
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global npm@11.13.0
          npm ci

      - name: Build shared packages
        run: npm run build:shared

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck:all

      - name: Unit tests
        run: npm run test

      - name: Contracts and workflow domain
        run: npm run test:contracts

      - name: Install Playwright browsers
        run: npm run playwright:install

      - name: Build
        run: npm run build:all

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Explicit development Mock organization path
        run: npm run test:e2e:mock

      - name: Archive frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence
          path: |
            test-results/
            !test-results/**/*.dump
            !test-results/**/*.local
            !test-results/**/*.env

  real-business:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: af_admin
          POSTGRES_DB: af_admin_ci_demo
          POSTGRES_PASSWORD: ci-only-isolated-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U af_admin -d af_admin_ci_demo"
          --health-interval 3s --health-timeout 3s --health-retries 20
      clamav:
        image: clamav/clamav:1.5.4
        env:
          CLAMAV_NO_FRESHCLAMD: 'true'
        ports:
          - 3310:3310
        options: >-
          --health-interval 10s --health-timeout 10s --health-start-period 120s --health-retries 30
    env:
      DATABASE_URL: postgresql://af_admin:ci-only-isolated-database@127.0.0.1:5432/af_admin_ci_demo
      APP_MODE: demo
      CI: true
      FILE_STORAGE_DIR: /tmp/af-admin-ci-files
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: 3310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and build all workspaces
        run: |
          npm install --global npm@11.13.0
          npm ci
          npm run build:all
          npm run playwright:install
      - name: Real database integration and common contracts
        run: |
          mkdir -p test-results/r1-ci
          npm run test:integration > test-results/r1-ci/integration.log 2>&1
      - name: Real API and worker
        run: |
          npm run api:migrate
          npm run api:seed
          node services/reference-api/dist/platform-demo.js
          npm run api:start > test-results/r1-ci/api.log 2>&1 &
          npm run worker:start > test-results/r1-ci/worker.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10888/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Multi-account production frontend E2E
        run: npm run test:e2e:real > test-results/r1-ci/browser.log 2>&1
      - name: Archive real business evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-business-evidence
          path: |
            test-results/
            !test-results/**/*.dump
            !test-results/**/*.local
            !test-results/**/*.env
